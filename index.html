<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLSG Service Desk</title>
<style>
:root{font:15px system-ui;color:#192a30;background:#f2f6f5;--ink:#163b39;--line:#dae5e2;--muted:#526964;--accent:#087565}*{box-sizing:border-box}body{margin:0}header{background:#112e2d;color:white;padding:16px max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header b{letter-spacing:.12em}header small{color:#c5dfd9}main{max-width:1228px;margin:auto;padding:34px 24px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:4px 0 8px;letter-spacing:-.055em}h2,h3,p{margin-top:0}.intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{color:var(--accent);font-weight:750;letter-spacing:.15em;font-size:.74rem}.muted{color:var(--muted)}.intro p{margin-bottom:0}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:white;padding:9px 13px;color:var(--ink);cursor:pointer;font-weight:650}button:hover{background:#e9f5f1}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.primary:hover{background:#075f52}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:13px}.metric{padding:15px 18px;color:var(--muted)}.metric strong{display:block;font-size:1.8rem;color:var(--ink)}.filters{padding:15px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select,textarea{border:1px solid #bccfc9;border-radius:7px;background:white;padding:9px;color:inherit;min-width:0}.filters input{flex:1;min-width:180px}.rows{padding:0 15px}.row{display:grid;grid-template-columns:minmax(200px,2fr) minmax(112px,1fr) minmax(110px,.85fr) minmax(110px,.85fr);align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:0;padding:15px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-bottom:4px}.pill{display:inline-block;width:fit-content;background:#e6f3ee;color:#155446;border-radius:50px;padding:4px 9px;font-size:.78rem}.urgent{background:#fae8dc;color:#8a3716}.empty{padding:24px}.dialog{width:min(680px,calc(100% - 24px));max-height:92vh;border:1px solid var(--line);border-radius:14px;padding:0;color:inherit}.dialog::backdrop{background:#09231db0}.dialog-head{display:flex;align-items:start;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:4px 0 0}.dialog-content{padding:20px 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-weight:650}.wide{grid-column:1/-1}textarea{resize:vertical}footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.history{margin-top:20px;border-top:1px solid var(--line);padding-top:15px}.history li{margin-bottom:7px;overflow-wrap:anywhere}.description{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#9c271b;margin-top:12px}#notice{margin:15px 0}.storage{font-size:.82rem;margin-top:14px}@media(max-width:680px){.intro{align-items:start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.row>span:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.filters select{flex:1}header small{display:none}}
</style><link rel="stylesheet" href="theme.css">
<header><div class="header-inner"><div><div class="eyebrow">SAP Transformation Lab · Interner Service</div><strong>LLSG Service Desk</strong></div><div class="wordmark"><b>LONG LIFE SCIENCES</b><small>ADDING LIFE TO YEARS</small></div></div></header>
<main>
<section class="intro"><div><div class="eyebrow">IT-SERVICEBEREICH</div><h1>Ticketübersicht</h1><p class="muted">Anliegen aufnehmen, bewerten und weiterverfolgen.</p></div><button class="primary" id="new">＋ Neues Ticket</button></section>
<section class="metrics" id="metrics" aria-label="Kennzahlen"></section>
<section class="panel" aria-label="Tickets"><div class="filters"><input id="search" type="search" aria-label="Tickets durchsuchen" placeholder="Ticketnummer oder Stichwort suchen"><select id="type" aria-label="Tickettyp filtern"></select><select id="status" aria-label="Status filtern"></select></div><div class="rows" id="rows"></div></section>
<p class="muted storage">Prototyp mit fiktiven LLSG-Daten. Tickets und Anhänge werden in diesem Browser gespeichert.</p><p id="notice" role="status"></p>
</main>
<dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><div><div class="eyebrow" id="dialog-kicker"></div><h2 id="dialog-title"></h2></div><button id="close" aria-label="Schließen">×</button></div><div class="dialog-content" id="content"></div></dialog>
<template id="rich-toolbar-template"><button type="button" data-rich-flag="bold" aria-label="Fett" title="Fett (Strg+B)" aria-pressed="false"><strong>B</strong></button><button type="button" data-rich-flag="italic" aria-label="Kursiv" title="Kursiv (Strg+I)" aria-pressed="false"><em>I</em></button><button type="button" data-rich-flag="underline" aria-label="Unterstrichen" title="Unterstrichen (Strg+U)" aria-pressed="false"><span class="rt-underline">U</span></button><button type="button" data-rich-flag="strike" aria-label="Durchgestrichen" title="Durchgestrichen" aria-pressed="false"><s>S</s></button><label>Schriftfarbe <select data-rich-color><option value="">Standard</option><option value="red">Rot</option><option value="green">Grün</option><option value="blue">Blau</option><option value="purple">Violett</option><option value="orange">Orange</option><option value="mixed" disabled>Gemischt</option></select></label><label>Hervorhebung <select data-rich-highlight><option value="">Keine Farbe</option><option value="yellow">Gelb</option><option value="green">Grün</option><option value="blue">Blau</option><option value="pink">Rosa</option><option value="mixed" disabled>Gemischt</option></select></label><label>Schriftgröße <select data-rich-size><option value="small">Klein · 14</option><option value="">Normal · 16</option><option value="large">Groß · 20</option><option value="xlarge">Sehr groß · 24</option><option value="mixed" disabled>Gemischt</option></select></label><button type="button" data-rich-list="bullet" aria-label="Aufzählung" title="Aufzählung ein-/ausschalten" aria-pressed="false">• Liste</button><button type="button" data-rich-list="number" aria-label="Nummerierte Liste" title="Nummerierung ein-/ausschalten" aria-pressed="false">1. Liste</button><button type="button" data-rich-clear title="Formatierung im markierten Text entfernen">Formatierung entfernen</button><button type="button" data-rich-undo aria-label="Textänderung rückgängig" title="Im Text rückgängig (Strg+Z)" disabled>↶</button><button type="button" data-rich-redo aria-label="Textänderung wiederholen" title="Im Text wiederholen (Strg+Y)" disabled>↷</button></template>
<script type='module' src='app.js'></script>
</html>
